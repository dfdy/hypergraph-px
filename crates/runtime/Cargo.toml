[package]
name = "hypergraph-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "hypergraph"
path = "src/main.rs"

[dependencies]
hypergraph-keychain = { path = "../keychain" }
hypergraph-storage = { path = "../storage" }
hypergraph-domain = { path = "../domain" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "=2.2.0"
httparse = "=1.10.1"
zeroize = { version = "=1.9.1", features = ["alloc"] }

[lints]
workspace = true
