[package]
name = "hypergraph-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hypergraph-keychain = { path = "../keychain" }
hypergraph-domain = { path = "../domain" }
hypergraph-crypto = { path = "../crypto" }
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "limits", "backup"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.4.3"
sha2 = "=0.11.1"
zeroize = { version = "=1.9.1", features = ["alloc"] }

[lints]
workspace = true
